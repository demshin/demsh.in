name: Site build and deployment

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: site-validation-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      JEKYLL_ENV: production
      BUNDLE_FROZEN: "true"
      BUNDLE_FORCE_RUBY_PLATFORM: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Ruby and install locked dependencies
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          ruby-version: "3.3.13"
          bundler: "2.6.5"
          bundler-cache: true
      - name: Test the site validator
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Record the build time and source
        run: |
          date -u '+time: "%Y-%m-%dT%H:%M:%SZ"' > "$RUNNER_TEMP/build-time.yml"
          git rev-parse HEAD > "$RUNNER_TEMP/source-sha.txt"
      - name: Build with the repository lockfile
        run: |
          bundle exec jekyll build --config "_config.yml,$RUNNER_TEMP/build-time.yml" --destination "$RUNNER_TEMP/site-candidate" --trace 2>&1 | tee "$RUNNER_TEMP/candidate-build.log"
          git diff --exit-code -- Gemfile Gemfile.lock
      - name: Validate generated pages and assets
        run: |
          python3 .github/scripts/check_site.py "$RUNNER_TEMP/site-candidate" --report "$RUNNER_TEMP/validation.json" | tee "$RUNNER_TEMP/validation.txt"
      - name: Package the verified site for Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site-candidate
          retention-days: 30
      - name: Save the build and validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-validation-${{ github.sha }}
          archive: true
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/site-candidate
            ${{ runner.temp }}/*-build.log
            ${{ runner.temp }}/build-time.yml
            ${{ runner.temp }}/source-sha.txt
            ${{ runner.temp }}/validation.*

  deploy:
    if: github.ref == 'refs/heads/master' && vars.PAGES_DEPLOY_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the verified artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        env:
          # Upstream's bundled whatwg-url still imports Node's deprecated punycode.
          NODE_OPTIONS: --disable-warning=DEP0040
